run_name: stability
models:
  - name: deepseek-chat
    base_url: https://api.deepseek.com
    env_key: LLM_API_KEY
    temperature: 0.7
  - name: qwen-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    env_key: DASHSCOPE_API_KEY
    temperature: 0.7
problems:
  - name: tsp
    scales: [small, medium, large]
  - name: binpacking
    scales: [small, medium, large]
  - name: pmachine
    scales: [small, medium, large]
instances_per_scale: 3
repeats: 5
max_iters: 5
budget:
  max_calls: 10
  max_tokens: 60000
  max_seconds: 600
